project:
  name: "books_openlibrary_pipeline"
  parser_version: "1.0.0"
  user_agent: "DataMiningCourseBot/1.0 (student: Arina Murashova; contact: student@mail.ru)"

paths:
  raw_dir: "raw"
  clean_dir: "clean"
  mart_dir: "mart"
  db_path: "db/warehouse.db"
  schema_path: "db/schema.sql"
  logs_dir: "logs"
  reports_dir: "reports"
  state_dir: "state"

sources:
  books_html:
    base_url: "https://books.toscrape.com/"
    catalogue_url: "https://books.toscrape.com/catalogue/"
    max_pages: 50
    rate_limit_sec: 0.35
    jitter_sec: 0.15
    timeout_sec: 15
    max_retries: 3
    circuit_breaker_threshold: 5

  openlibrary_api:
    base_url: "https://openlibrary.org/search.json"
    rate_limit_sec: 0.5
    jitter_sec: 0.2
    timeout_sec: 20
    max_retries: 3
    circuit_breaker_threshold: 5
    max_titles_per_run: 300

quality_thresholds:
  min_clean_records: 500
  max_reject_rate: 0.05
  max_null_price_rate: 0.01
  max_null_rating_rate: 0.01
  min_enrichment_rate: 0.15
  max_duplicate_rate: 0.00

alert_thresholds:
  max_error_rate: 0.10
  max_p95_latency_ms: 5000.0
  max_volume_drop_pct: 0.20
  max_reject_rate: 0.05
